<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  }

  .card {
    background: rgba(255, 255, 255, 0.97);
    border-radius: 20px;
    padding: 60px 50px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    max-width: 480px;
    animation: fadeUp 0.8s ease-out;
  }

  .icon {
    font-size: 56px;
    margin-bottom: 20px;
  }

  h1 {
    font-size: 32px;
    color: #333;
    margin-bottom: 12px;
  }

  p {
    color: #666;
    font-size: 16px;
    line-height: 1.6;
    margin-bottom: 30px;
  }

  .btn {
    display: inline-block;
    padding: 14px 36px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    text-decoration: none;
    border-radius: 30px;
    font-weight: 600;
    font-size: 15px;
    border: none;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(118, 75, 162, 0.4);
  }

  @keyframes fadeUp {
    from {
      opacity: 0;
      transform: translateY(30px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
</style>
</head>
<body>

  <div class="card">
    <div class="icon">👋</div>
    <h1>Welcome!</h1>
    <p>We're glad you're here. Get started by exploring what's inside — everything is ready and waiting for you.</p>
    <button class="btn" onclick="alert('Let\'s get started!')">Get Started</button>
  </div>

</body>
</html>
